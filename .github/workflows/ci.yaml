name: CI

on:
  push:
    branches:
      - "**"

defaults:
  run:
    working-directory: sys-src/sensiq-aws

jobs:
  ci-aws:
    name: CI AWS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: sys-src/sensiq-aws/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Test
        run: yarn test --ci --forceExit --passWithNoTests