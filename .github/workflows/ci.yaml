name: CI

on:
  push:
    branches:
      - "**"

env:
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  ci-aws:
    name: CI AWS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sys-src/sensiq-aws
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: sys-src/sensiq-aws/yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TS
        run: yarn lint:ts

      - name: Test TS
        run: yarn test:ts --ci --forceExit --passWithNoTests

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Install Python dependencies
        run: yarn setup:python

      - name: Lint Lambda
        run: yarn lint:lambda

      - name: Test Lambda
        run: yarn test:lambda
  ci-frontend:
    name: CI Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sys-src/sensiq-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: sys-src/sensiq-frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TS
        run: yarn lint

      - name: Test TS
        run: yarn test

      - name: Typecheck
        run: yarn tsc --noEmit

  compile-sensiq-hardware:
    name: Compile Sensiq Hardware Sketch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # production build with no test code included
          - name: production
            compile-flags: ""
          # test build with test code included
          - name: tests
            compile-flags: "-DRUN_TESTS=1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Ensures the config header is available for the compiler,
      # even if the real credentials are not checked into the repo
      - name: Provide config.h from template
        run: |
          if [ ! -f sys-src/sensiq-hardware/src/config.h ]; then
            cp sys-src/sensiq-hardware/src/template_config_h.txt sys-src/sensiq-hardware/src/config.h
          fi

      - name: Compile Arduino Sketch (${{ matrix.name }})
        uses: arduino/compile-sketches@v1.1.2
        with:
          # Standard ESP32 Dev Module FQBN
          fqbn: "esp32:esp32:esp32"
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
              version: 3.3.8
          libraries: |
            - name: ArduinoHttpClient
            - name: MQTT
            - name: ArduinoJson
            - name: DHT sensor library
            - name: AUnit
          sketch-paths: |
            - sys-src/sensiq-hardware/src/src.ino
          cli-compile-flags: |
            - --build-property
            - compiler.cpp.extra_flags=${{ matrix.compile-flags }}
          enable-deltas-report: false
          verbose: false
