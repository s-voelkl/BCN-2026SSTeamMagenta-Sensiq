name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    
env:
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  deploy-aws:
    name: Deploy AWS
    runs-on: ubuntu-latest
    permissions:
        id-token: write
        contents: read

    defaults:
        run:
            working-directory: sys-src/sensiq-aws

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: |
            sys-src/sensiq-aws/yarn.lock
            sys-src/sensiq-frontend/yarn.lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile

      - name: Lint TS
        run: yarn lint:ts

      - name: Test TS
        run: yarn test:ts --ci --forceExit --passWithNoTests

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Install Python dependencies
        run: yarn setup:python

      - name: Lint Lambda
        run: yarn lint:lambda

      - name: Test Lambda
        run: yarn test:lambda

      - name: Install frontend dependencies
        working-directory: sys-src/sensiq-frontend
        run: yarn install --frozen-lockfile

      - name: Build frontend
        working-directory: sys-src/sensiq-frontend
        env:
          VITE_API_KEY: ${{ secrets.VITE_API_KEY}}
          VITE_API_URL: ${{ secrets.VITE_API_URL}}
        run: yarn build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: CDK Synth
        run: npx cdk synth

      - name: CDK Diff
        run: npx cdk diff --all

      - name: CDK Deploy
        run: npx cdk deploy --all --require-approval never --tags Environment=prod --outputs-file cdk-outputs.json

      - name: Sync frontend to S3
        run: |
          BUCKET=$(jq -r 'to_entries[] | .value.BucketName // empty' cdk-outputs.json | head -n1)
          if [ -z "$BUCKET" ]; then
            echo "::error::Could not find BucketName in cdk-outputs.json"
            exit 1
          fi
          echo "Syncing frontend to bucket: $BUCKET"
 
          # Hashed assets: cache forever (immutable filenames).
          aws s3 sync ../sensiq-frontend/dist "s3://$BUCKET" --delete 