# python project configuration, https://packaging.python.org/en/latest/guides/writing-pyproject-toml

# project metadata
[project]
name = "sensiq-aws"
dynamic = ["version"] # version is determined dynamically from git tags

# minimum python version supported
requires-python = ">= 3.12"

authors = [
    { name = "Simon Völkl", email = "s.voelkl2@oth-aw.de" },
    { name = "Johannes Schieder", email = "j.schieder@oth-aw.de" },
    { name = "Sebastian Rosner", email = "s.rosner@oth-aw.de" },
    { name = "Andre Tien Vu", email = "a.vu@oth-aw.de" },
]

description = "Sensiq is a cloud-based IoT air-quality monitoring system."
readme = "README.md"
license = "MIT"
keywords = [
    "IoT",
    "Environmental Monitoring",
    "ESP32",
    "MCU",
    "MQTT",
    "Serverless Architecture",
    "AWS",
]

# see https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Framework :: AWS CDK :: 2",
    "Natural Language :: English",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://github.com/s-voelkl/BCN-2026SSTeamMagenta-Sensiq/tree/main/sys-doc"
Repository = "https://github.com/s-voelkl/BCN-2026SSTeamMagenta-Sensiq"
Issues = "https://github.com/s-voelkl/BCN-2026SSTeamMagenta-Sensiq/issues"

[tool]
# ruff configuration, see: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
# supported python version
target-version = "py312"

# maximum line length (default is 88, similar to Black formatter)
line-length = 88
indent-width = 4

# folders and files to be completely ignored (similar to ESLint)
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "coverage",
    "bin",
    "infra",
    "cdk.out",
    "node_modules",
    "test",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]

# explicitly ignore specific rules (e.g., E501 = line length)
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
# here explicitly inverted to tabs for better readability in the codebase, as per the team's preference
indent-style = "tab"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
# This is currently disabled by default, but it is planned for this to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in docstrings.
# This only has an effect when the `docstring-code-format` setting is enabled.
docstring-code-line-length = "dynamic"

# pytest configuration
[tool.pytest.ini_options]
# pytest looks here for test functions
testpaths = ["src/lambda"]

# if running from lambda_tests, also look in lambda for test dependencies
pythonpath = ["lambda"]

# coverage report as markdown file for better readability in the codebase, stored in coverage folder
addopts = "--cov=lambda --cov-report=term-missing --cov-report=markdown:coverage/pytest-lambda-coverage.md"
